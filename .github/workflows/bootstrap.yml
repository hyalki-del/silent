name: Borderline Protocol Bootstrap

on:
  workflow_dispatch:
    inputs:
      full_payload:
        description: "Paste all files here"
        required: true
        type: string

jobs:
  inject:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      FULL_PAYLOAD: ${{ github.event.inputs.full_payload }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebuild Repository
        shell: bash
        run: |
          python3 <<'PYTHON'
          import os
          import sys

          payload = os.environ.get("FULL_PAYLOAD", "")

          if not payload.strip():
              print("Payload is empty.")
              sys.exit(1)

          current_file = None
          buffer = []
          written = []

          def flush():
              global current_file, buffer

              if current_file is None:
                  return

              folder = os.path.dirname(current_file)
              if folder:
                  os.makedirs(folder, exist_ok=True)

              with open(current_file, "w", encoding="utf-8", newline="") as f:
                  f.write("\n".join(buffer))

              written.append(current_file)

          for line in payload.splitlines():

              if line.startswith("=== FILE:") and line.endswith("==="):

                  flush()

                  current_file = (
                      line[len("=== FILE:"):-3]
                      .strip()
                  )

                  buffer = []

              else:
                  buffer.append(line)

          flush()

          print("")
          print("Files written:")
          for f in written:
              print(" -", f)

          print("")
          print(f"Total: {len(written)} file(s)")
          PYTHON

      - name: Commit
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Automatic repository update"
          git push

name: Borderline Manual Payload Injector

on:
  workflow_dispatch:
    inputs:
      target_file:
        description: 'Hedef Dosya Yolu (örn: src/app/page.tsx)'
        required: true
        default: 'src/app/page.tsx'
        type: string
      file_content:
        description: 'Dosya İçeriği (Plaintext olarak buraya yapıştır)'
        required: true
        type: string

jobs:
  write-payload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Inject Content into File
        run: |
          DIR=$(dirname "${{ github.event.inputs.target_file }}")
          mkdir -p "$DIR"
          echo "${{ github.event.inputs.file_content }}" > "${{ github.event.inputs.target_file }}"

      - name: Commit and Push Changes
        run: |
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "payload: manual inject into ${{ github.event.inputs.target_file }}" && git push)

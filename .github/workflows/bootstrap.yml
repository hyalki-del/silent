name: Borderline Manual Multi-File Injector

on:
  workflow_dispatch:
    inputs:
      full_payload:
        description: 'Tüm dosyaları ve içeriklerini plaintext olarak buraya yapıştır'
        required: true
        type: string

jobs:
  inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Parse and Write Files
        run: |
          cat << 'EOF' > parser.py
          import os

          payload = """${{ github.event.inputs.full_payload }}"""
          
          # Dosyaları bölmek için özel bir ayırıcı kullanıyoruz: === FILE: yol/adi ===
          current_file = None
          current_content = []

          for line in payload.splitlines():
              if line.startswith("=== FILE:"):
                  if current_file:
                      os.makedirs(os.path.dirname(current_file), exist_ok=True)
                      with open(current_file, "w", encoding="utf-8") as f:
                          f.write("\n".join(current_content).strip() + "\n")
                  current_file = line.replace("=== FILE:", "").strip()
                  current_content = []
              else:
                  current_content.append(line)

          if current_file:
              os.makedirs(os.path.dirname(current_file), exist_ok=True)
              with open(current_file, "w", encoding="utf-8") as f:
                  f.write("\n".join(current_content).strip() + "\n")
          EOF

          python3 parser.py
          rm parser.py

      - name: Commit and Push Changes
        run: |
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat: manual multi-file payload injection" && git push)

name: Borderline Protocol Bootstrap

on:
  workflow_dispatch:
    inputs:
      full_payload:
        description: 'Tüm dosya içeriklerini plaintext olarak buraya yapıştır'
        required: true
        type: string

jobs:
  repair-and-inject:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Execute Parser and Write Files
        run: |
          python3 -c '
          import os

          payload = """${{ github.event.inputs.full_payload }}"""
          
          current_file = None
          current_content = []

          for line in payload.splitlines():
              stripped = line.strip()
              if stripped.startswith("=== FILE:") and stripped.endswith("==="):
                  if current_file:
                      os.makedirs(os.path.dirname(current_file), exist_ok=True)
                      with open(current_file, "w", encoding="utf-8") as f:
                          f.write("\n".join(current_content).strip() + "\n")
                  current_file = stripped.replace("=== FILE:", "").replace("===", "").strip()
                  current_content = []
              else:
                  current_content.append(line)

          if current_file:
              os.makedirs(os.path.dirname(current_file), exist_ok=True)
              with open(current_file, "w", encoding="utf-8") as f:
                  f.write("\n".join(current_content).strip() + "\n")
          '

      - name: Commit and Push Changes
        run: |
          git add package.json src/data/mockNodes.ts src/app/page.tsx
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "fix: repair workflow payload injection and push files" && git push)
